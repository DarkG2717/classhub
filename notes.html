
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Access course notes and lecture materials on ClassHub.">

    <title>Course Notes | ClassHub</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/notes.css">

    <!-- JavaScript -->
    <script src="js/main.js" defer></script>
    <script src="js/course-data.js" defer></script>
    <script src="js/notes.js" defer></script>
</head>

<body>

    <!-- =========================
         HEADER AND NAVIGATION
    ========================== -->

    <header class="site-header">

        <nav class="navbar" aria-label="Main navigation">

            <a href="index.html" class="logo">
                ClassHub
            </a>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="timetable.html">Timetable</a>
                </li>

                <li>
                    <a href="notes.html" aria-current="page">Notes</a>
                </li>

                <li>
                    <a href="announcements.html">Updates</a>
                </li>

                <li>
                    <a href="contacts.html">Contacts</a>
                </li>
            </ul>

        </nav>

    </header>


    <!-- =========================
         MAIN NOTES CONTENT
    ========================== -->

    <main class="notes-page">

        <section class="notes-heading">

            <h1>Course Notes</h1>

            <p>
                Welcome to the ClassHub course library.
                Select a course to explore its lectures
                and access the available study materials.
            </p>

        </section>


        <!-- COURSE SEARCH -->

        <section class="notes-search-section">

            <label for="notes-search">
                Search for a course
            </label>

            <input
                type="search"
                id="notes-search"
                placeholder="Search by course code or name..."
                autocomplete="off"
            >

        </section>


        <!-- COURSE CARDS -->

        <section class="notes-courses-section">

            <div
                id="notes-container"
                class="notes-grid"
                aria-live="polite"
            >

                <p>Loading courses...</p>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>
            &copy;
            <span id="year"></span>
            ClassHub. Built for our class.
        </p>

    </footer>

</body>

</html>
