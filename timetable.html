

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View your weekly ClassHub timetable, course codes, times and venues.">

    <title>Class Timetable | ClassHub</title>

    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/timetable.css">

    <script src="js/main.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/timetable.js" defer></script>
</head>

<body>

    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo">ClassHub</a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="timetable.html" aria-current="page">Timetable</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="announcements.html">Updates</a></li>
                <li><a href="contacts.html">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <main class="timetable-page">

        <section class="timetable-heading">
            <h1>My Class Timetable</h1>
            <p>Your weekly lectures, times and venues — all in one place.</p>
        </section>

        <!-- Group selector -->
        <section class="timetable-controls">

            <label for="group-filter">Select your group:</label>

            <select id="group-filter">
                <option value="A">Group A</option>
                <option value="B">Group B</option>
            </select>

        </section>

        <!-- Timetable -->
        <section class="timetable-section">

            <div class="table-container">

                <table class="timetable-table">

                    <thead>
                        <tr>
                            <th scope="col">Day</th>
                            <th scope="col">Course Code</th>
                            <th scope="col">Time</th>
                            <th scope="col">Venue</th>
                        </tr>
                    </thead>

                    <tbody id="timetable-body">
                        <tr>
                            <td colspan="4">Loading timetable...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>
            &copy; <span id="year"></span> ClassHub.
            Built for our class.
        </p>
    </footer>

</body>
</html>
